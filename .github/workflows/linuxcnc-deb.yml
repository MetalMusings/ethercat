# Builds linuxcnc-ethercat-uspace_*.deb (the userspace master for LinuxCNC's
# ecat component, see packaging/linuxcnc/README.md) for Debian 12 and 13,
# with packaging/linuxcnc/build-deb.sh.
#
# - "Run workflow" on the Actions tab: the packages are kept as artifacts of
#   the run (90 days, downloadable when logged in).
# - A pushed tag uspace-v* (git tag uspace-v1.1 && git push github
#   uspace-v1.1): the packages are also put on a release for the tag.
#
# Up to uspace-v1.0 the package was built in MetalMusings/linuxcnc-ethercat,
# together with lcec_uspace.

name: LinuxCNC master package

on:
  workflow_dispatch:
  push:
    tags: ['uspace-v*']

permissions:
  contents: read

jobs:
  deb:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        debian: [bookworm, trixie]
    container: debian:${{ matrix.debian }}
    steps:
      - name: Build tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential git autoconf automake libtool pkg-config \
            libxdp-dev libbpf-dev libexpat1-dev dpkg-dev file ca-certificates

      - uses: actions/checkout@v4

      - name: Build the package
        run: |
          # The checkout belongs to another user than the container's root.
          git config --global --add safe.directory '*'
          packaging/linuxcnc/build-deb.sh -o out

      - uses: actions/upload-artifact@v4
        with:
          name: deb-${{ matrix.debian }}
          path: out/*.deb
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/uspace-v')
    needs: deb
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true

      - name: Release ${{ github.ref_name }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Pre-release while the userspace master is experimental.
          gh release create "${{ github.ref_name }}" out/*.deb \
            --repo "${{ github.repository }}" --prerelease \
            --title "Userspace EtherCAT master for LinuxCNC ${{ github.ref_name }}" \
            --notes "Packages of the userspace EtherCAT master for LinuxCNC's [ecat](https://github.com/MetalMusings/ecat) component: debian12 for Debian 12 (bookworm), debian13 for Debian 13 (trixie). Since 1.1 without lcec_uspace (frozen; keep uspace-v1.0 from MetalMusings/linuxcnc-ethercat for it). See [packaging/linuxcnc/README.md](https://github.com/${{ github.repository }}/blob/${{ github.ref_name }}/packaging/linuxcnc/README.md)."
